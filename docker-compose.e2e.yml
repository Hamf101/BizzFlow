# Object storage for the end-to-end suite.
#
# The app stores file bytes in Cloudflare R2 over the S3 API with
# `forcePathStyle: true` (src/lib/r2/client.ts), so a local S3 implementation is
# a drop-in substitute and keeps the suite free of cloud credentials.
#
# Postgres and Auth are NOT here: those come from `supabase start`, which owns
# the migrations and mints the JWT keys the app expects.
#
# Tags are pinned deliberately. MinIO's community images stopped at the
# 2025-09-07 release when the project shifted focus to its commercial build, so
# "latest" is not a moving target anyway — but pinning keeps CI reproducible.
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bizflow-e2e
      MINIO_ROOT_PASSWORD: bizflow-e2e-secret
      # Presigned PUT URLs are used from the browser, so the bucket has to
      # accept cross-origin requests from the app's dev origin.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Storage is deliberately ephemeral — every run starts with an empty bucket,
    # which is what makes create-only (IfNoneMatch) writes reproducible.
    tmpfs:
      - /data

  create-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set e2e http://minio:9000 bizflow-e2e bizflow-e2e-secret &&
      mc mb --ignore-existing e2e/bizflow-e2e &&
      echo bucket-ready
      "
