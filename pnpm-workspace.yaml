allowBuilds:
  # sentry-cli's postinstall downloads the binary used for sourcemap upload.
  # The published Gemini SDK and protobuf runtime already include distributable
  # artifacts; their package build scripts are not required by this application.
  '@google/genai': false
  '@sentry/cli': true
  # Its postinstall only prints a funding banner.
  core-js: false
  protobufjs: false
  sharp: true
  unrs-resolver: true

# Seven days. This applies to direct and transitive dependencies.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Security exceptions name an exact reviewed version, the way pnpm documents
# them. Renovate writes the entry itself into this list when it opens a security
# PR for a version still inside the age gate (renovatebot/renovate#40020), so
# the list must stay present, even empty. Remove an entry once it ages. pnpm
# 11.10 predates minimumReleaseAgeExcludePrune, so pruning stays a manual step
# until the pinned package manager is deliberately updated.
minimumReleaseAgeExclude:
  # GHSA fix for fast-uri <3.1.9 (via @sentry/nextjs's webpack plugin); reviewed
  # 2026-10-25: no dependencies or install scripts, published from the fastify repo
  # by GitHub Actions. Ages out 2026-10-26.
  - fast-uri@3.1.9

overrides:
  postcss: 8.5.23
  # Event-loop DoS in indexed source-map offsets below 1.2.2 (via postcss, css-tree).
  source-map-js: 1.2.2
  # Memory-growth and stats-normalization advisories in browserslist <=4.28.6.
  # Pinned to the reviewed 4.x release already beyond the seven-day age gate.
  browserslist: 4.28.8
  # Transitive advisory floor: sharp inherits libvips CVEs below 0.35 (via next).
  sharp: '>=0.35.5'
  # DoS advisory GHSA-mh99-v99m-4gvg; scoped to the 5.x line used by glob 13.
  # Raised to 5.0.12 for GHSA-6j4f-fj2g-mc7p (below 5.0.10) and GHSA-q2hr-2g5m-vwhr (below 5.0.12).
  brace-expansion@5: '>=5.0.12'
  # GHSA-m9gg-hp2v-232j: unauthorized certificates reported as authorized below 1.14.5;
  # reached through inngest's OpenTelemetry exporters.
  '@grpc/grpc-js@1': '>=1.14.5'
  # Host confusion and SSRF advisories; reached through @sentry/webpack-plugin.
  # Bounded below 4 so the advisory floor cannot drag in a major upgrade. Raised
  # to 3.1.8: 3.1.6 is in GHSA-qw65-cvwx-89v3 and GHSA-58mr-gqgx-xq4g; to 3.1.9
  # for the 2026-10 host-delimiter and path-normalization advisories.
  fast-uri: '>=3.1.9 <4'
  # Custom generators can loop indefinitely; reached through the pinned postcss.
  # Bounded below 4 for the same reason.
  nanoid: '>=3.3.18 <4'
  # GHSA-p98j-92pf-mc4p: DOM XSS through IN_PLACE sanitising in 3.4.13–3.4.15;
  # reached through posthog-js. Bounded below 4 for the same reason.
  dompurify: '>=3.4.16 <4'
