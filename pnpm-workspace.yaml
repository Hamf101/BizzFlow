allowBuilds:
  # sentry-cli's postinstall downloads the binary used for sourcemap upload.
  # The published Gemini SDK and protobuf runtime already include distributable
  # artifacts; their package build scripts are not required by this application.
  '@google/genai': false
  '@sentry/cli': true
  protobufjs: false
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@16.2.12'
  - '@next/eslint-plugin-next@16.2.12'
  - '@next/swc-darwin-arm64@16.2.12'
  - '@next/swc-darwin-x64@16.2.12'
  - '@next/swc-linux-arm64-gnu@16.2.12'
  - '@next/swc-linux-arm64-musl@16.2.12'
  - '@next/swc-linux-x64-gnu@16.2.12'
  - '@next/swc-linux-x64-musl@16.2.12'
  - '@next/swc-win32-arm64-msvc@16.2.12'
  - '@next/swc-win32-x64-msvc@16.2.12'
  - eslint-config-next@16.2.12
  - next@16.2.12

overrides:
  postcss: 8.5.23
  # Transitive advisory floor: sharp inherits libvips CVEs below 0.35 (via next).
  sharp: '>=0.35.3'
  # DoS advisory GHSA-mh99-v99m-4gvg; scoped to the 5.x line used by glob 13.
  brace-expansion@5: '>=5.0.8'
