allowBuilds:
  # sentry-cli's postinstall downloads the binary used for sourcemap upload.
  # The published Gemini SDK and protobuf runtime already include distributable
  # artifacts; their package build scripts are not required by this application.
  '@google/genai': false
  '@sentry/cli': true
  core-js: true
  protobufjs: false
  sharp: true
  unrs-resolver: true

# Seven days. This applies to direct and transitive dependencies.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Security exceptions must name an exact reviewed version and be removed after
# it ages. pnpm 11.10 predates minimumReleaseAgeExcludePrune, so pruning remains
# a manual review step until the pinned package manager is deliberately updated.
minimumReleaseAgeExclude: []

overrides:
  postcss: 8.5.23
  # Transitive advisory floor: sharp inherits libvips CVEs below 0.35 (via next).
  sharp: '>=0.35.3'
  # DoS advisory GHSA-mh99-v99m-4gvg; scoped to the 5.x line used by glob 13.
  # Raised to 5.0.9: 5.0.8 is still in the advisory's vulnerable range.
  brace-expansion@5: '>=5.0.9'
  # Host confusion via backslash; reached through @sentry/webpack-plugin.
  # Bounded below 4 so the advisory floor cannot drag in a major upgrade.
  fast-uri: '>=3.1.5 <4'
  # Custom generators can loop indefinitely; reached through the pinned postcss.
  # Bounded below 4 for the same reason.
  nanoid: '>=3.3.18 <4'
